<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지?｜今天吃什麼？</title>
<style>
:root {
  /* SKKU & S-LEAGUE Dark & Emerald Color Palette */
  --skku-green: #0B6B3A;
  --skku-emerald: #128A4B;
  --skku-dark: #003328;
  --skku-light-bg: #F2F7F4;
  --header-bg: #0D1210; /* Full-width sleek black header background */
  
  /* Appetite-stimulating Warm Accent Tones */
  --warm-accent: #E85D2A;
  --warm-gold: #FF9F1C;
  --warm-soft-bg: #FFFBF7;
  
  /* Text and Surface Variables */
  --text-main: #1A2824;
  --text-muted: #5C6E67;
  --card-bg: rgba(255, 255, 255, 0.96);
  --line-color: #D6E4DC;
  --shadow-soft: 0 12px 32px rgba(0, 72, 57, 0.08);
  --shadow-hover: 0 16px 36px rgba(0, 173, 135, 0.16);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Noto Sans KR", sans-serif;
  background: linear-gradient(145deg, #EDF4F0 0%, #F8FAF9 45%, #F5F9F6 100%);
  color: var(--text-main);
  min-height: 100vh;
  word-break: keep-all;
  overflow-wrap: break-word;
}

button { font: inherit; }

/* Full-Width Edge-to-Edge Top Header Bar */
.top-header {
  width: 100%;
  background: var(--header-bg);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -.5px;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-badge {
  background: var(--skku-emerald);
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px; /* Modern squared-rounded badge */
  font-weight: 800;
  letter-spacing: 0.5px;
}

.nav-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* 方圓框按鈕 (Squared-Rounded Buttons) */
.lang {
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px; /* 方圓框 Style */
  padding: 8px 16px;
  cursor: pointer;
  font-weight: 800;
  color: #ffffff;
  transition: all .2s ease;
  font-size: 14px;
}

.lang:hover {
  border-color: var(--skku-emerald);
  background: rgba(0, 173, 135, 0.2);
  color: #ffffff;
}

.home-btn {
  border: 1px solid var(--skku-emerald);
  background: var(--skku-emerald);
  border-radius: 10px; /* 方圓框 Style */
  padding: 8px 16px;
  cursor: pointer;
  text-decoration: none;
  color: #ffffff;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s ease;
  box-shadow: 0 4px 12px rgba(0, 173, 135, 0.25);
}

.home-btn:hover {
  background: #128A4B;
  border-color: #128A4B;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0, 173, 135, 0.35);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 24px 20px 50px;
}

.hero {
  text-align: center;
  padding: 24px 0 20px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0, 72, 57, 0.08);
  color: var(--skku-green);
  border: 1px solid rgba(0, 173, 135, 0.25);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 800;
}

h1 {
  font-size: clamp(38px, 6vw, 60px);
  line-height: 1.08;
  margin: 18px 0 12px;
  letter-spacing: -2px;
  color: var(--skku-green);
  font-weight: 900;
}

.subtitle {
  color: var(--text-muted);
  font-size: 17px;
  margin: 0 auto;
  max-width: 650px;
  line-height: 1.7;
}

.layout {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 22px;
  margin-top: 24px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--line-color);
  border-radius: 24px;
  padding: 24px;
  box-shadow: var(--shadow-soft);
  backdrop-filter: blur(10px);
  transition: transform .2s ease, box-shadow .2s ease;
}

.card h2 {
  margin: 0 0 16px;
  font-size: 19px;
  color: var(--skku-green);
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card h2::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 18px;
  background: var(--skku-emerald);
  border-radius: 4px;
}

.field-label {
  display: block;
  margin: 20px 0 10px;
  font-size: 13px;
  font-weight: 900;
  color: var(--skku-green);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.campuses {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.campus {
  border: 1px solid var(--line-color);
  background: #fff;
  border-radius: 12px;
  padding: 11px 8px;
  cursor: pointer;
  font-weight: 800;
  color: var(--text-main);
  transition: all .2s ease;
  text-align: center;
}

.campus:hover {
  border-color: var(--skku-emerald);
  background: #F0F9F6;
  color: var(--skku-green);
  transform: translateY(-1px);
}

.campus.active {
  border-color: var(--skku-green);
  background: var(--skku-green);
  color: #fff;
  box-shadow: 0 6px 14px rgba(0, 72, 57, 0.2);
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.cat {
  border: 1px solid var(--line-color);
  background: #fff;
  border-radius: 14px;
  padding: 13px;
  cursor: pointer;
  text-align: left;
  transition: all .2s ease;
}

.cat:hover {
  border-color: var(--skku-emerald);
  background: #F2FAF7;
  transform: translateY(-1px);
}

.cat.active {
  border-color: var(--skku-emerald);
  background: linear-gradient(135deg, #EAF6F2 0%, #FFFFFF 100%);
  box-shadow: 0 0 0 2px var(--skku-emerald);
  transform: translateY(-1px);
}

.cat .emoji {
  font-size: 24px;
  display: block;
  margin-bottom: 5px;
}

.cat b {
  color: var(--skku-green);
}

.cat small {
  color: var(--text-muted);
  font-size: 12px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.primary {
  flex: 1;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  background: linear-gradient(135deg, var(--skku-emerald) 0%, var(--skku-green) 100%);
  color: white;
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(0, 173, 135, 0.28);
  transition: all .2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(0, 173, 135, 0.38);
}

.secondary {
  border: 1px solid var(--line-color);
  background: white;
  color: var(--skku-green);
  border-radius: 14px;
  padding: 16px 20px;
  font-weight: 800;
  cursor: pointer;
  transition: all .2s ease;
}

.secondary:hover {
  background: #F2F7F4;
  border-color: var(--skku-emerald);
}

.result {
  min-height: 380px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  border: 2px solid var(--line-color);
  background: linear-gradient(160deg, #FFFFFF 0%, #F5FAF7 100%);
}

.result::before {
  content: "";
  position: absolute;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 159, 28, 0.18) 0%, rgba(0, 173, 135, 0.08) 60%, transparent 100%);
  right: -80px;
  top: -80px;
  z-index: 0;
}

.result > * {
  position: relative;
  z-index: 1;
}

.result .foodemoji {
  font-size: 78px;
  margin-bottom: 8px;
  filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.08));
}

.result .country {
  color: var(--warm-accent);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.5px;
  background: rgba(232, 93, 42, 0.08);
  display: inline-block;
  margin: 0 auto;
  padding: 4px 14px;
  border-radius: 999px;
}

.result h3 {
  font-size: 36px;
  margin: 12px 0 8px;
  letter-spacing: -1px;
  color: var(--skku-green);
  font-weight: 900;
}

.result p {
  color: var(--text-muted);
  margin: 0 auto;
  max-width: 480px;
  line-height: 1.6;
}

.result .place {
  font-weight: 900;
  margin-top: 10px;
  font-size: 21px;
  color: var(--skku-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.result .meta {
  display: grid;
  gap: 8px;
  margin: 16px auto 0;
  max-width: 560px;
  text-align: left;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.5;
  width: 100%;
}

.result .meta div {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--line-color);
  border-radius: 14px;
  padding: 10px 14px;
  box-shadow: 0 2px 8px rgba(0, 72, 57, 0.03);
}

.result .meta b {
  color: var(--skku-green);
}

.tags {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}

.tag {
  background: rgba(0, 72, 57, 0.06);
  border: 1px solid rgba(0, 173, 135, 0.15);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
  color: var(--skku-green);
}

.tip {
  font-size: 13px;
  color: var(--text-muted);
}

.list {
  margin-top: 24px;
}

.list-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 16px;
}

.food-item {
  padding: 14px 16px;
  border: 1px solid var(--line-color);
  border-radius: 16px;
  background: #fff;
  transition: all .2s ease;
}

.food-item:hover {
  border-color: var(--skku-emerald);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 72, 57, 0.06);
}

.food-item b {
  display: block;
  margin-bottom: 4px;
  color: var(--skku-green);
  font-size: 15px;
}

.food-item span {
  font-size: 12px;
  color: var(--text-muted);
}

@media (max-width: 820px) {
  .header-inner { padding: 12px 16px; }
  .logo { font-size: 19px; gap: 6px; }
  .logo-badge { font-size: 10px; padding: 2px 6px; }
  .lang, .home-btn { font-size: 12px; padding: 6px 12px; border-radius: 8px; }
  .container { padding: 16px 12px 40px; }
  h1 { font-size: clamp(30px, 7vw, 44px); margin: 12px 0 8px; letter-spacing: -1px; }
  .subtitle { font-size: 14px; line-height: 1.6; }
  .hero { padding: 15px 0 16px; }
  .layout { grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
  .card { padding: 18px 14px; border-radius: 20px; }
  .card h2 { font-size: 17px; margin-bottom: 12px; }
  .campuses { gap: 6px; }
  .campus { padding: 10px 4px; font-size: 13px; }
  .categories { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cat { padding: 10px; border-radius: 12px; }
  .cat .emoji { font-size: 20px; margin-bottom: 2px; }
  .cat b { font-size: 14px; }
  .cat small { font-size: 11px; line-height: 1.2; }
  .result { min-height: 300px; padding: 20px 14px; }
  .result .foodemoji { font-size: 58px; margin-bottom: 4px; }
  .result h3 { font-size: clamp(22px, 6vw, 30px); margin: 8px 0; }
  .result .place { font-size: 18px; }
  .result .meta { font-size: 13px; margin-top: 12px; }
  .result .meta div { padding: 8px 10px; word-break: break-all; }
  .food-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
}

@media (max-width: 480px) {
  .header-inner {
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 10px 14px;
    gap: 8px;
  }
  .logo { font-size: 17px; }
  .nav-actions { gap: 6px; }
  .campuses { grid-template-columns: repeat(3, 1fr); }
  .categories { grid-template-columns: repeat(2, 1fr); }
  .food-grid { grid-template-columns: 1fr; }
  .actions { flex-direction: column; gap: 8px; }
  .primary, .secondary { width: 100%; padding: 14px; }
  .food-item { padding: 12px; }
}
</style>
</head>

function render(){
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t] || el.textContent);
  document.getElementById("langBtn").textContent = lang === "ko" ? "中文" : "한국어";
  document.documentElement.lang = lang === "ko" ? "ko" : "zh-Hant";
  
  // Render Campus Buttons
  const campusBox = document.getElementById("campuses");
  campusBox.innerHTML = "";
  campuses.forEach(x => {
    const b = document.createElement("button");
    b.className = "campus" + (campus === x.id ? " active" : "");
    b.textContent = lang === "ko" ? x.ko : x.zh;
    b.onclick = () => { campus = x.id; render(); };
    campusBox.appendChild(b);
  });

  // Render Category Buttons
  const c = document.getElementById("categories");
  c.innerHTML = "";
  cats.forEach(x => {
    const b = document.createElement("button");
    b.className = "cat" + (selected === x.id ? " active" : "");
    b.innerHTML = `<span class="emoji">${x.emoji}</span><b>${lang === "ko" ? x.ko : x.zh}</b><br><small>${x.desc}</small>`;
    b.onclick = () => { selected = x.id; render(); };
    c.appendChild(b);
  });

  // Render Grid Pool
  const arr = getPool();
  document.getElementById("count").textContent = `${arr.length} ${lang === "ko" ? "items" : "項推薦"}`;
  
  document.getElementById("foodGrid").innerHTML = arr.map(f => {
    if(f.place) {
      return `
        <div class="food-item">
          <b>${f.emoji} ${f.place}</b>
          <span style="display:block;margin:2px 0 4px;font-weight:bold;color:var(--warm-accent);">${lang === "ko" ? f.ko : f.zh} · ${lang === "ko" ? f.country : f.countryZh}</span>
          <span style="font-size:11px;line-height:1.3;display:block;color:var(--text-muted);">📍 ${f.address}</span>
        </div>
      `;
    } else {
      return `
        <div class="food-item">
          <b>${f.emoji} ${lang === "ko" ? f.ko : f.zh}</b>
          <span>${lang === "ko" ? f.country : f.countryZh}</span>
        </div>
      `;
    }
  }).join("");
}

function getPool(){
  if (campus === "all") {
    return selected === "all" ? foods : foods.filter(f => f.cat === selected);
  } else {
    let list = campusFoods.filter(f => f.campus === campus);
    if (selected !== "all") {
      list = list.filter(f => f.cat === selected);
    }
    return list;
  }
}

function draw(){
  const arr = getPool();
  if(!arr.length) return;
  const f = arr[Math.floor(Math.random() * arr.length)];
  const r = document.getElementById("result");
  
  if (f.place) {
    r.innerHTML = `
      <div class="foodemoji">${f.emoji}</div>
      <div class="country">${lang === "ko" ? f.country : f.countryZh} · ${f.campus === "insa" ? (lang === "ko" ? "인사캠" : "人文社會校區") : (lang === "ko" ? "자과캠" : "自然科學校區")}</div>
      <h3>${lang === "ko" ? f.ko : f.zh}</h3>
      <div class="place">📍 ${f.place}</div>
      <div class="meta">
        <div><b>${T[lang].address}:</b> ${f.address}</div>
        <div><b>${T[lang].hours}:</b> ${f.hours}</div>
      </div>
      <div class="tags">
        <span class="tag">${lang === "ko" ? "랜덤 당첨" : "🎉 今日推薦"}</span>
        <span class="tag">${lang === "ko" ? "캠퍼스 맛집/패스트푸드" : "校園名店/主題餐廳"}</span>
        <span class="tag">${lang === "ko" ? "고민 끝!" : "選擇障礙結束！"}</span>
      </div>
      <div class="tip">${T[lang].sourceNote}</div>
    `;
  } else {
    r.innerHTML = `
      <div class="foodemoji">${f.emoji}</div>
      <div class="country">${lang === "ko" ? f.country : f.countryZh}</div>
      <h3>${lang === "ko" ? f.ko : f.zh}</h3>
      <p>${lang === "ko" ? "오늘은 이걸로 결정! 배달 앱에서 바로 검색해보세요." : "今天就決定吃這個！直接在外送 App 搜尋看看吧。"}</p>
      <div class="tags">
        <span class="tag">${lang === "ko" ? "랜덤 당첨" : "隨機抽中"}</span>
        <span class="tag">${lang === "ko" ? "배달 추천" : "外送推薦"}</span>
        <span class="tag">${lang === "ko" ? "고민 끝" : "選擇障礙結束"}</span>
      </div>
      <div class="tip">${lang === "ko" ? "🎉 다시 뽑고 싶다면 버튼을 한 번 더 눌러주세요." : "🎉 不滿意？再抽一次就好！"}</div>
    `;
  }
}

document.getElementById("drawBtn").onclick = draw;
document.getElementById("allBtn").onclick = () => { selected = "all"; campus = "all"; render(); };
document.getElementById("langBtn").onclick = () => { lang = lang === "ko" ? "zh" : "ko"; render(); };

// Initial Render
render();
</script>
</body>
</html>
