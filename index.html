<style>
:root{
  --bg:#fff8f1; --card:#ffffff; --text:#2d2521; --muted:#7c6f68;
  --accent:#ff7043; --accent2:#ffb74d; --line:#f0e3d8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans KR",sans-serif;
background:linear-gradient(135deg,#fff8f1 0%,#fff2e7 48%,#fffaf6 100%);color:var(--text);min-height:100vh}
button{font:inherit}
.container{max-width:1100px;margin:auto;padding:28px 20px 50px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
.hero{text-align:center;padding:25px 0 22px}
.badge{display:inline-block;background:#fff0e8;color:#e85d2a;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800}
h1{font-size:clamp(38px,6vw,64px);line-height:1.05;margin:18px 0 12px;letter-spacing:-2.5px}
.subtitle{color:var(--muted);font-size:17px;margin:0 auto;max-width:650px;line-height:1.7}
.layout{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;margin-top:28px}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 35px rgba(100,60,30,.07)}
.card h2{margin:0 0 16px;font-size:18px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px;cursor:pointer;text-align:left;transition:.2s}
.cat:hover,.cat.active{border-color:#ff9b72;background:#fff4ed;transform:translateY(-1px)}
.cat .emoji{font-size:22px;display:block;margin-bottom:5px}.cat small{color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px}
.primary{flex:1;border:0;border-radius:16px;padding:15px;background:var(--accent);color:white;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(255,112,67,.25)}
.secondary{border:1px solid var(--line);background:white;border-radius:16px;padding:15px 18px;cursor:pointer}
.result{min-height:365px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;overflow:hidden}
.result:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#fff0e5;right:-90px;top:-80px;z-index:0}
.result>*{position:relative;z-index:1}
.result .foodemoji{font-size:72px;margin-bottom:8px}
.result .country{color:#e85d2a;font-weight:800;font-size:14px}
.result h3{font-size:40px;margin:8px 0 7px;letter-spacing:-1.5px}
.result p{color:var(--muted);margin:0 auto;max-width:480px;line-height:1.6}
.tags{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:17px 0}
.tag{background:#f8f1eb;border-radius:999px;padding:6px 10px;font-size:12px;color:#6d5e55}
.tip{font-size:13px;color:var(--muted)}
.list{margin-top:20px}.list-title{display:flex;justify-content:space-between;align-items:center}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.food-item{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}
.food-item b{display:block;margin-bottom:4px}.food-item span{font-size:12px;color:var(--muted)}
@media(max-width:780px){.layout{grid-template-columns:1fr}.food-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

</div>

 {id:"th",emoji:"🌶️",ko:"태국식",zh:"泰式",desc:"팟타이 · 커리 · 똠얌"},
 {id:"us",emoji:"🍔",ko:"미국식",zh:"美式",desc:"버거 · 피자 · 윙"},
 {id:"it",emoji:"🍝",ko:"이탈리아식",zh:"義式",desc:"파스타 · 피자 · 리조또"}
];

let lang="ko", selected="all";

const T={
ko:{brand:"오늘 뭐 먹지?",badge:"매일 고민하는 메뉴 추천",title:"오늘 뭐 먹지?",subtitle:"매일 “뭐 먹지?” 고민하는 시간을 줄이고, 지금 당장 메뉴를 랜덤으로 추천해드려요.",choose:"취향을 골라보세요",draw:"오늘의 메뉴 뽑기",all:"전체",menuTitle:"추천 메뉴 미리보기",readyCountry:"RANDOM FOOD",ready:"무엇을 먹을지 결정해볼까요?",readyText:"카테고리를 선택하고 버튼을 눌러보세요.",tag1:"배달하기 쉬운 메뉴",tag2:"랜덤 추천",tag3:"한·중 bilingual",tip:"💡 결정하기 싫은 날일수록 랜덤에게 맡겨보세요."},
zh:{brand:"今天吃什麼？",badge:"每天都不知道要吃什麼",title:"今天吃什麼？",subtitle:"每天都在煩惱「要吃什麼？」太麻煩了。選擇喜歡的料理類型，讓系統幫你隨機決定今天的外送餐點。",choose:"選擇你想吃的類型",draw:"抽選今天吃什麼",all:"全部",menuTitle:"推薦料理預覽",readyCountry:"RANDOM FOOD",ready:"要不要讓系統幫你決定？",readyText:"先選擇料理類型，再按下抽選按鈕。",tag1:"適合外送",tag2:"隨機推薦",tag3:"韓中雙語",tip:"💡 越不想決定的日子，越適合交給隨機抽選。"}
};

function render(){
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[lang][el.dataset.t]||el.textContent);
 document.getElementById("langBtn").textContent=lang==="ko"?"中文":"한국어";
 document.documentElement.lang=lang==="ko"?"ko":"zh-Hant";
 const c=document.getElementById("categories"); c.innerHTML="";
 cats.forEach(x=>{
   const b=document.createElement("button"); b.className="cat"+(selected===x.id?" active":"");
   b.innerHTML=`<span class="emoji">${x.emoji}</span><b>${lang==="ko"?x.ko:x.zh}</b><br><small>${x.desc}</small>`;
   b.onclick=()=>{selected=x.id;render()};
   c.appendChild(b);
 });
 const arr=selected==="all"?foods:foods.filter(f=>f.cat===selected);
 document.getElementById("count").textContent=`${arr.length} ${lang==="ko"?"menus":"道料理"}`;
 document.getElementById("foodGrid").innerHTML=arr.map(f=>`<div class="food-item"><b>${f.emoji} ${lang==="ko"?f.ko:f.zh}</b><span>${lang==="ko"?f.country:f.countryZh}</span></div>`).join("");
}
function draw(){
 const arr=selected==="all"?foods:foods.filter(f=>f.cat===selected);
 const f=arr[Math.floor(Math.random()*arr.length)];
 const r=document.getElementById("result");
 r.innerHTML=`<div class="foodemoji">${f.emoji}</div><div class="country">${lang==="ko"?f.country:f.countryZh}</div><h3>${lang==="ko"?f.ko:f.zh}</h3><p>${lang==="ko"?"오늘은 이걸로 결정! 배달 앱에서 바로 검색해보세요.":"今天就決定吃這個！直接在外送 App 搜尋看看吧。"}</p><div class="tags"><span class="tag">${lang==="ko"?"랜덤 당첨":"隨機抽中"}</span><span class="tag">${lang==="ko"?"배달 추천":"外送推薦"}</span><span class="tag">${lang==="ko"?"고민 끝":"選擇障礙結束"}</span></div><div class="tip">${lang==="ko"?"🎉 다시 뽑고 싶다면 버튼을 한 번 더 눌러주세요.":"🎉 不滿意？再抽一次就好！"}</div>`;
}
document.getElementById("drawBtn").onclick=draw;
document.getElementById("allBtn").onclick=()=>{selected="all";render()};
document.getElementById("langBtn").onclick=()=>{lang=lang==="ko"?"zh":"ko";render()};
render();
</script>
</body>
</html>
